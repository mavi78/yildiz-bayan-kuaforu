version: '3.8'

services:
  # PostgreSQL 15 - Ana veritabanı
  postgres:
    image: postgres:15-alpine
    container_name: yildiz-salon-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: yildiz_salon_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=tr_TR.UTF-8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - yildiz-network

  # Redis 7 - Cache ve Job Queue
  redis:
    image: redis:7-alpine
    container_name: yildiz-salon-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass redis_password
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - yildiz-network

  # pgAdmin 4 - PostgreSQL yönetim arayüzü (opsiyonel, development için)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: yildiz-salon-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@yildiz-salon.local
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - yildiz-network
    profiles:
      - tools

  # Redis Commander - Redis yönetim arayüzü (opsiyonel, development için)
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: yildiz-salon-redis-commander
    restart: unless-stopped
    environment:
      - REDIS_HOSTS=local:redis:6379:0:redis_password
    ports:
      - "8081:8081"
    depends_on:
      - redis
    networks:
      - yildiz-network
    profiles:
      - tools

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  yildiz-network:
    driver: bridge

